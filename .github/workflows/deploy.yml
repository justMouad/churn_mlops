name: Deploy

# À la fusion sur main (code ou nouveaux artefacts) : build, push GHCR, puis déploiement optionnel par SSH.
on:
  push:
    branches: [main]
    paths: ["churnops/**", "app/**", "artifacts/**", "Dockerfile", "requirements*.txt"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    # Activer en définissant la variable de dépôt DEPLOY_ENABLED=true et les secrets SSH_HOST / SSH_USER / SSH_KEY
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker pull ${{ env.IMAGE }}:latest
            docker rm -f churn-api || true
            docker run -d --name churn-api --restart unless-stopped -p 8000:8000 ${{ env.IMAGE }}:latest
            sleep 10 && curl -sf localhost:8000/health
