name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests
        run: pytest -q --cov=churnops --cov=app --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  docker:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: churn-forecast-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test du conteneur
        run: |
          docker run -d --name api -p 8000:8000 churn-forecast-api:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break || sleep 2; done
          curl -sf localhost:8000/health | grep '"status":"ok"'
          curl -sf -X POST localhost:8000/forecast -H 'Content-Type: application/json' -d '{"horizon":7}' | grep forecast
          docker logs api | tail -20
