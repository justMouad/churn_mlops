name: Retrain

# Réentraînement hebdomadaire + à la demande. Le réentraînement n'a lieu que si une dérive est détectée
# (ou si "force" est coché). Un garde-fou compare le candidat au modèle en production avant promotion.
on:
  schedule:
    - cron: "0 3 * * 1"        # tous les lundis, 03:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Forcer le réentraînement même sans dérive"
        type: boolean
        default: false
      simulate_drift:
        description: "Démo : simuler un lot de données dérivées"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Récupérer les données récentes
        # À REMPLACER : télécharger le dernier lot de production (S3, base de données, entrepôt...)
        # vers data/incoming/latest.csv. Sans fichier, le script utilise un lot synthétique.
        run: mkdir -p data/incoming

      - name: Contrôle de dérive
        id: drift
        run: |
          ARGS=""
          if [ "${{ inputs.simulate_drift }}" = "true" ]; then ARGS="--simulate-drift"; fi
          python scripts/check_drift.py --current data/incoming/latest.csv $ARGS

      - name: Sauvegarder le registre de production
        run: cp artifacts/registry.json /tmp/prev_registry.json

      - name: Réentraîner
        if: steps.drift.outputs.retrain == 'true' || inputs.force
        id: train
        run: |
          python scripts/train_all.py
          echo "trained=true" >> "$GITHUB_OUTPUT"

      - name: Tests + garde-fou de promotion
        if: steps.train.outputs.trained == 'true'
        run: |
          pytest -q
          python scripts/promote_gate.py --prod /tmp/prev_registry.json --candidate artifacts/registry.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrain-reports
          path: |
            reports/
            artifacts/registry.json

      - name: Ouvrir une Pull Request avec les nouveaux artefacts
        if: steps.train.outputs.trained == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: retrain/${{ github.run_id }}
          title: "chore(ml): réentraînement automatique (run ${{ github.run_id }})"
          body: |
            Réentraînement déclenché par ${{ github.event_name }}.
            Voir l'artefact `retrain-reports` (rapport de dérive) et `artifacts/registry.json` (métriques).
            Le déploiement part automatiquement à la fusion sur `main` (workflow Deploy).
          commit-message: "chore(ml): nouveaux artefacts de modèle"
          add-paths: artifacts/
